[workspace]
# Use the latest resolver available
resolver = "3"
# Include both parts of the library in the workspace
members = [
    "deboa",
    #"deboa-compio",
    "deboa-macros",
    "deboa-smol",
    "deboa-tokio",
]

[workspace.package]
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/deboa"
homepage = "https://github.com/ararog/deboa"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.75.0"

[workspace.dependencies]
deboa = { path = "deboa" }
deboa-extras = { path = "../deboa-contrib/deboa-extras" }
deboa-fory = { path = "../deboa-contrib/deboa-fory" }
deboa-macros = { path = "deboa-macros" }
deboa-tokio = { path = "deboa-tokio" }
vamo = { path = "../vamo/vamo" }
vamo-macros = { path = "../vamo/vamo-macros" }

[profile.test]
lto = false

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
