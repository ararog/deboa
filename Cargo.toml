[workspace]
# Use the latest resolver available
resolver = "3"
# Include both parts of the library in the workspace
members = [
    "deboa",
    #"deboa-h3",
    #"deboa-compio",
    "deboa-glommio",
    #"deboa-macros",
    #"deboa-smol",
    "deboa-test-utils",
    #"deboa-tokio",
]

[workspace.package]
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/deboa"
homepage = "https://github.com/ararog/deboa"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"

[workspace.dependencies]
#deboa = { path = "deboa", version = ">= 0.1.2" }
deboa = { path = "deboa" }
deboa-compio = { path = "deboa-compio" }
deboa-glommio = { path = "deboa-glommio" }
deboa-h3 = { path = "deboa-h3", version = "^0.1.1" }
deboa-extras = { version = ">= 0.0.9" }
deboa-fory = { version = ">= 0.1.6" }
deboa-macros = { path = "deboa-macros" }
deboa-smol = { path = "deboa-smol" }
deboa-test-utils = { path = "deboa-test-utils" }
deboa-tokio = { path = "deboa-tokio" }
hyper-body-utils = { version = ">= 0.1.14", default-features = false }
vamo = { version = ">= 0.0.9" }
vamo-macros = { version = ">= 0.0.9" }

[profile.test]
lto = false

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The bindings depend on the *published* `deboa`, so a change to the core cannot
# be built or tested locally without this. A patch rather than a path dependency
# because `deboa-extras`, `vamo` and `deboa-fory` also depend on the published
# crate — a path dep puts two versions of `deboa` in the graph and their traits
# stop matching.
[patch.crates-io]
deboa = { path = "deboa" }
