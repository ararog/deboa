futures-util = "0.3.33"
http = "1.5.0"
http-body-util = "0.1"
mime = { version = "0.3.17" }
multer = "3.1.0"
once_cell = "1.21.4"
rand = "0.10.2"
serde = "1.0.229"
tackle = "0.1.3"
url = "2.5.8"
vamo = { workspace = true, default-features = false }
vamo-macros = { workspace = true, features = [
  "json",
], default-features = false }
vetis = "0.1.4"

[dev-dependencies]
caramelo = "0.1.2"
