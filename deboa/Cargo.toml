[package]
name = "deboa"
version = "0.1.2"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A friendly rest client on top of hyper."
readme = "README.md"
license.workspace = true
keywords = ["http", "networking", "client", "fetch", "rest-client"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []

[dependencies]
async-lock = "3.4.2"
base64 = "0.23.0"
bytes = { version = "1.11" }
cookie = { version = "0.18.1", default-features = false }
futures = { version = "0.3.31", default-features = false }
hashbrown = "0.17.1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1.10.1", features = ["client", "http1", "http2"], default-features = false }
hyper-body-utils = { workspace = true, default-features = false }
hyper-util = { version = "0.1.20", features = [
  "client",
  "client-legacy",
], default-features = false }
indexmap = "2.11.4"
log = "0.4.33"
minimime = "1.0.0"
rand = { version = "0.10.1", default-features = false, features = ["std", "thread_rng"] }
regex = { version = "1.12.4", default-features = false }
serde = { version = "1.0.217", default-features = false, features = ["derive"] }
tackle = { version = "0.1.1"}
thiserror = "2.0.17"
time = { version = "0.3.53", default-features = false }
url = "2.5.8"
urlencoding = "2.1.3"

[dev-dependencies]
caramelo = "0.1.1-beta.3"
criterion = { version = "0.8.2", features = [
  "html_reports",
  "async",
  "async_smol",
  "async_tokio",
] }
mime = { version = "0.3.17" }
multer = "3.1.0"
