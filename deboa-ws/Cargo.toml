[package]
name = "deboa-ws"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
license.workspace = true
rust-version.workspace = true

[features]

default = ["tokio"]
tokio = ["dep:tokio", "hyper-util/tokio"]
smol = ["dep:smol", "dep:smol-hyper"]

[dependencies]
base64 = { workspace = true }
deboa = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
pin-project-lite = { workspace = true }
rand = { workspace = true }
smol = { version = "2.0.2", optional = true, default-features = false }
smol-hyper = { version = "0.1.0", optional = true, default-features = false }
thiserror = { workspace = true }
tokio = { version = "1.53.1", optional = true, features = ["io-std"] }
ws-framer = { workspace = true }
