[package]
name = "deboa-compio"
version = "0.1.1-beta.9"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A friendly rest client on top of hyper."
readme = "README.md"
license.workspace = true
keywords = ["http", "networking", "client", "fetch", "rest-client"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = [
  "http2",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
]

rust-tls = [
  "compio-tls/rustls",
  "dep:rustls-native-certs",
  "dep:webpki-roots",
]

webpki-rustls-verifier = ["__webpki_rustls_verifier"]
platform-rustls-verifier = ["__platform_rustls_verifier"]

default-rustls-verifier = ["__webpki_rustls_verifier"]
__webpki_rustls_verifier = ["dep:webpki-roots"]
__platform_rustls_verifier = ["dep:rustls-platform-verifier"]

# rustls providers
no-provider = []
aws-lc-rustls-provider = ["__rustls_aws_lc_rs"]
ring-rustls-provider = ["__rustls_ring"]
rustcrypto-rustl-provider = ["__rustls_rustcrypto"]

default-rustls-provider = ["__rustls_aws_lc_rs"]
__rustls_aws_lc_rs = ["rustls/aws-lc-rs"]
__rustls_ring = ["rustls/ring"]
__rustls_rustcrypto = ["dep:rustls-rustcrypto"]

# tls implementations
native-tls = ["compio-tls/native-tls"]

# protocols
http1 = ["hyper/http1", "hyper-util/http1"]
http2 = ["hyper/http2", "hyper-util/http2"]
http3 = [
  "deboa-h3/compio",
  "dep:h3",
  "hyper-body-utils/http3",
  "hyper-body-utils/compio",
  "compio-quic/h3",
  "compio-quic/ring",
]

[dependencies]
async-executor = { version = "1.13.3", optional = true, default-features = false }
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = { version = "1.11" }
compio-quic = { version = "0.8.0", default-features = false, optional = true }
compio-tls = { version = "0.10.0", default-features = false, optional = true }
cookie = "0.18.1"
cyper-core = "0.9.0"
deboa = { workspace = true }
deboa-h3 = { workspace = true, optional = true }
futures = "0.3.31"
futures-util = { version = "0.3.31", default-features = false }
h3 = { version = "0.0.8", optional = true, default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1.8.1", features = ["client"], default-features = false }
hyper-body-utils = { workspace = true, default-features = false }
hyper-util = { version = "0.1.20", features = [
  "client",
  "client-legacy",
], default-features = false }
indexmap = "2.11.4"
io-uring = "0.7.13"
log = "0.4.28"
minimime = "1.0.0"
mockall = "0.15.0"
pin-project-lite = "0.2.17"
rand = "0.10.2"
regex = "1.9.6"
rustls = { version = "0.23.36", optional = true, default-features = false }
rustls-native-certs = { version = "0.8.0", optional = true, default-features = false }
rustls-pki-types = { version = "1.13.2", optional = true, default-features = false }
rustls-platform-verifier = { version = "0.7.0", optional = true, default-features = false }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true, default-features = false }
send_wrapper = { version = "0.6.0", default-features = false }
serde = { version = "1.0.217", features = ["derive"] }
thiserror = "2.0.17"
time = "0.3.53"
url = "2.5.8"
urlencoding = "2.1.3"
webpki-roots = { version = "1.0.6", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
compio = { version = "0.19.1", features = [
  "io",
  "net",
  "runtime",
  "io-uring",
  "macros",
  "tls"
], default-features = false }

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
compio = { version = "0.19.1", features = [
  "io",
  "net",
  "runtime",
  "polling",
  "macros",
  "tls"
], default-features = false }

[dev-dependencies]
ciborium = "0.2.2"
compio = { version = "0.19.1", default-features = false }
deboa-extras = { workspace = true, default-features = false, features = [
  "serialization_all",
] }
deboa-fory = { workspace = true, default-features = false }
deboa-macros = { workspace = true }
criterion = { version = "0.8.2", features = [
  "html_reports",
  "async",
  "async_smol",
  "async_tokio",
] }
easyhttpmock-vetis-compio = { version = "0.1.0", features = [
  "http2",
  "rust-tls",
], default-features = false }
fory = "1.1.0"
fory-core = "1.1.0"
futures-util = "0.3.31"
mime = { version = "0.3.17" }
multer = "3.1.0"
vamo.workspace = true
vamo-macros.workspace = true
