[package]
name = "deboa-compio"
version = "0.1.4"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A friendly rest client on top of hyper."
readme = "README.md"
license.workspace = true
keywords = ["http", "networking", "client", "fetch", "rest-client"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
features = [
  "http1",
  "http2",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
]

[features]
default = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
]

rust-tls = [
  "compio-tls/rustls",
  "rustls/tls12",
  "dep:rustls-native-certs",
  "dep:webpki-roots",
]

webpki-rustls-verifier = ["__webpki_rustls_verifier"]
platform-rustls-verifier = ["__platform_rustls_verifier"]

default-rustls-verifier = ["__webpki_rustls_verifier"]
__webpki_rustls_verifier = ["dep:webpki-roots"]
__platform_rustls_verifier = ["dep:rustls-platform-verifier"]

# rustls providers
no-provider = []
aws-lc-rustls-provider = ["__rustls_aws_lc_rs"]
ring-rustls-provider = ["__rustls_ring"]

default-rustls-provider = ["__rustls_aws_lc_rs"]
__rustls_aws_lc_rs = ["rustls/aws-lc-rs"]
__rustls_ring = ["rustls/ring"]

# tls implementations
native-tls = ["compio-tls/native-tls"]

# protocols
http1 = ["hyper/http1", "hyper-util/http1"]
http2 = ["hyper/http2", "hyper-util/http2"]
http3 = [
  "deboa-h3/compio",
  "dep:h3",
  "hyper-body-utils/compio-h3",
  "compio-quic/h3",
  "compio-quic/ring",
]

[dependencies]
async-executor = { workspace = true }
async-lock = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
compio-quic = { version = "0.8.2", default-features = false, optional = true }
compio-tls = { version = "0.10.0", default-features = false, optional = true }
cookie = { workspace = true }
cyper-core = "0.9.0"
deboa = { workspace = true }
deboa-h3 = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
h3 = { version = "0.0.8", optional = true }
hashbrown = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-body-utils = { workspace = true, default-features = false }
hyper-util = { workspace = true }
indexmap = "2.11.4"
io-uring = "0.7.13"
log = { workspace = true }
minimime = { workspace = true }
pin-project-lite = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
serde = { workspace = true , features = ["derive"] }
tackle = { workspace = true }
thiserror = { workspace = true  }
url = { workspace = true }
urlencoding = { workspace = true }
webpki-roots = { workspace = true, optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
compio = { version = "0.19.2", features = [
  "fs",
  "io",
  "net",
  "runtime",
  "io-uring",
  "macros",
  "time",
  "tls"
], default-features = false }

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
compio = { version = "0.19.2", features = [
  "fs",
  "io",
  "net",
  "runtime",
  "polling",
  "macros",
  "time",
  "tls"
], default-features = false }

[dev-dependencies]
caramelo = { workspace = true }
compio = { version = "0.19.2", default-features = false }
criterion = { version = "0.8.2", features = [
  "html_reports",
  "async",
  "async_smol",
  "async_tokio",
] }
deboa-test-utils = { workspace = true }
easyhttpmock-vetis-compio = { version = "0.1.1", features = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
], default-features = false }
futures-util = { workspace = true }
multer = { workspace = true }
rstest = { workspace = true }
time = { workspace = true }
