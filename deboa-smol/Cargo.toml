[package]
name = "deboa-smol"
version = "0.1.3"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A friendly rest client on top of hyper."
readme = "README.md"
license.workspace = true
keywords = ["http", "networking", "client", "fetch", "rest-client"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
features = [
  "http1",
  "http2",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
]

[features]
default = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
]

# tls
rust-tls = [
  "rustls/tls12",
  "dep:rustls-native-certs",
  "dep:futures-rustls",
  "dep:rustls-pki-types",
]

webpki-rustls-verifier = ["__webpki_rustls_verifier"]
platform-rustls-verifier = ["__platform_rustls_verifier"]

default-rustls-verifier = ["__webpki_rustls_verifier"]
__webpki_rustls_verifier = ["dep:webpki-roots"]
__platform_rustls_verifier = ["dep:rustls-platform-verifier"]

# rustls providers
no-provider = []
aws-lc-rustls-provider = ["__rustls_aws_lc_rs"]
ring-rustls-provider = ["__rustls_ring"]

default-rustls-provider = ["__rustls_aws_lc_rs"]
__rustls_aws_lc_rs = ["futures-rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs"]
__rustls_ring = ["futures-rustls/ring", "quinn/rustls-ring"]

native-tls = ["async-native-tls/runtime-smol"]

# protocols
http1 = ["rustls/tls12", "hyper/http1", "hyper-util/http1"]
http2 = ["rustls/tls12", "hyper/http2", "hyper-util/http2"]
http3 = [
  "deboa-h3/generic",
  "dep:futures",
  "dep:h3",
  "dep:h3-quinn",
  "dep:rustls",
  "quinn/runtime-smol",
  "hyper-body-utils/generic",
  "hyper-body-utils/generic-h3",
]

websockets = ["ws-framer/http", "ws-framer/alloc"]

[dependencies]
async-executor = { workspace = true, optional = true }
async-lock = { workspace = true }
async-native-tls = { workspace = true, optional = true }
base64 = { workspace = true }
bytes = { workspace = true }
cookie = { workspace = true }
deboa = { workspace = true }
deboa-h3 = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
futures-rustls = { version = "0.26.0", optional = true, default-features = false }
futures-timeout = "0.2.1"
futures-util = { workspace = true, optional = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
hashbrown = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-body-utils = { workspace = true, default-features = false }
hyper-util = { workspace = true }
indexmap = "2.11.4"
log = { workspace = true }
macro_rules_attribute = { version = "0.2.2", default-features = false }
minimime = { workspace = true }
quinn = { version = "0.11.11", optional = true, default-features = false }
rand = { workspace = true }
regex = { workspace = true }
rstest = "0.26.1"
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
serde = { workspace = true , features = ["derive"] }
smol = { version = "2.0.2", default-features = false }
smol-hyper = { version = "0.1.0", default-features = false }
smol-macros = { version = "0.1.1", default-features = false }
tackle = { workspace = true }
thiserror = { workspace = true  }
url = { workspace = true }
urlencoding = { workspace = true }
webpki-roots = { workspace = true, optional = true, default-features = false }
ws-framer = { workspace = true, optional = true }

[dev-dependencies]
caramelo = { workspace = true }
criterion = { version = "0.8.2", features = [
  "html_reports",
  "async",
  "async_smol",
] }
deboa-test-utils = { workspace = true }
easyhttpmock-vetis-smol = { version = "0.1.0", features = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
], default-features = false }
futures-util = { workspace = true }
multer = { workspace = true }
rstest = { workspace = true }
smol = "2.0.2"
time = { workspace = true }
